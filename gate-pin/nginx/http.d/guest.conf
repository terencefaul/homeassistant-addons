# The public front door. Everything here is reachable from the internet.
server {
  listen 8888 default_server;
  server_name _;
  root /app/www/guest;

  # No third-party asset is ever loaded by the guest page, and no referrer is
  # ever sent. A link credential lives in the URL; a request to any outside
  # host would carry it out in the Referer header.
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;

  # Written at boot from the trusted_proxy_cidr option. CF-Connecting-IP is set
  # by Cloudflare and overwrites whatever the client sent, so unlike
  # X-Forwarded-For it cannot be forged -- but only while this port is
  # unreachable except through the tunnel.
  include /etc/nginx/real_ip.conf;

  # Refuse every other /api/ path outright. Without this the SPA fallback below
  # swallows /api/admin/* and answers 200 with index.html -- no data leaks, but
  # an auditor reading the status code sees "exposed", and a future edit that
  # did start proxying /api/ here would be invisible against that background.
  # Longest-prefix wins in nginx, so /api/guest/ below still matches first.
  location /api/ {
    return 404;
  }

  # ONLY this prefix is proxied. /api/admin/ is unreachable here by
  # construction, not by an application-level check.
  location /api/guest/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
    proxy_read_timeout 30s;
  }

  # /g/<token> lands here and is served as a static file. The GET never reaches
  # application code at all, which is the strongest available form of "a GET
  # must never act" -- messengers fetch URLs to build link previews, and a GET
  # that could open the gate would open it the moment you sent the link.
  location / {
    try_files $uri /index.html;
  }
}
