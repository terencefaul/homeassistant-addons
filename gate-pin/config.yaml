name: Gate PIN
version: "0.2.1"
slug: gate_pin
description: Time-limited guest access to chosen Home Assistant entities via a PIN or a link
url: https://github.com/terencefaul/homeassistant-addons
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: services
boot: auto

# Admin panel is reached through ingress only. It is deliberately NOT published.
ingress: true
ingress_port: 8099
panel_icon: mdi:gate
panel_title: Gate PIN

homeassistant_api: true

# The guest port is declared but unmapped by default. Leave it null when
# cloudflared runs as an add-on on the same machine: it reaches this container
# over the add-on network and 8888 never binds on the host, which is the
# precondition that makes trusting CF-Connecting-IP safe.
ports:
  8888/tcp: null
ports_description:
  8888/tcp: >-
    Guest page. Leave unmapped when cloudflared runs as an add-on. Only map it
    if your tunnel runs on another host, and firewall it to that host.

options:
  external_base_url: "https://gate.example.com"
  telegram_bot_token: ""
  telegram_chat_ids: []
  notify_service: ""
  pin_length: 6
  max_live_pin_grants: 20
  trusted_proxy_cidr: "172.30.32.0/23"
  audit_retention_days: 90
  require_cf_header: true

schema:
  external_base_url: url
  telegram_bot_token: password
  telegram_chat_ids:
    - int
  notify_service: str?
  pin_length: int(6,10)
  max_live_pin_grants: int(1,200)
  trusted_proxy_cidr: str
  audit_retention_days: int(1,3650)
  require_cf_header: bool
