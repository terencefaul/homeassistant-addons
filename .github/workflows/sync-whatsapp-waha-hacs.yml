name: Sync whatsapp-waha-integration to HACS repo

# HACS requires custom_components/<domain>/ at the repo root and doesn't
# support monorepo subdirectories, so the integration's history is split
# out with `git subtree split` and mirrored to a standalone public repo
# (terencefaul/whatsapp-waha-integration) on every relevant push to main.
# That repo is generated output -- edits belong here, in the monorepo.

on:
  push:
    branches: [main]
    paths:
      - 'whatsapp-waha-integration/**'
  workflow_dispatch: {}

jobs:
  split-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Split the whatsapp-waha-integration subtree
        run: git subtree split -P whatsapp-waha-integration -b hacs-split

      - name: Push to the standalone HACS repo
        run: |
          git push "https://x-access-token:${TOKEN}@github.com/terencefaul/whatsapp-waha-integration.git" hacs-split:main --force
        env:
          TOKEN: ${{ secrets.WHATSAPP_WAHA_DEPLOY_TOKEN }}
