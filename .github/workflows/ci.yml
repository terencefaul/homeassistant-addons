name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build frontend
        working-directory: gate-pin/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: pip install -r gate-pin/requirements.txt pytest

      # Runs after the frontend build so the "no service worker on the public
      # origin" assertions check real build output, not just the config.
      - name: Test
        working-directory: gate-pin
        run: python -m pytest tests -q

  build-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            base: ghcr.io/home-assistant/amd64-base-python:3.12-alpine3.20
            platform: linux/amd64
          - arch: aarch64
            base: ghcr.io/home-assistant/aarch64-base-python:3.12-alpine3.20
            platform: linux/arm64
          - arch: armv7
            base: ghcr.io/home-assistant/armv7-base-python:3.12-alpine3.20
            platform: linux/arm/v7
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # requirements.txt is installed with --only-binary=:all:, so this job
      # fails loudly the day a musl wheel stops being published for an
      # architecture rather than silently compiling Rust for twenty minutes.
      - name: Build ${{ matrix.arch }}
        uses: docker/build-push-action@v6
        with:
          context: gate-pin
          platforms: ${{ matrix.platform }}
          build-args: BUILD_FROM=${{ matrix.base }}
          push: false
